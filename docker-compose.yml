name: eventhub

# Validation des JWT depuis un conteneur : les jetons sont emis pour l'URL que voit le
# navigateur (http://localhost:8081), injoignable depuis le reseau Docker. Les services
# recuperent donc les cles publiques de Keycloak par son nom de service, tout en continuant
# de verifier que l'emetteur du jeton est bien l'URL publique (issuer-uri de leur config).
x-jwt-env: &jwt-env
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/eventhub/protocol/openid-connect/certs

# Logs JSON (une ligne par evenement) dans les conteneurs, texte en developpement.
# La banniere Spring Boot est ecrite hors du logger : desactivee pour que chaque ligne
# de sortie soit du JSON.
x-logs-env: &logs-env
  SPRING_PROFILES_ACTIVE: json-logs
  SPRING_MAIN_BANNER_MODE: "off"

# Meme raison pour show-sql, qui ecrit directement sur la sortie standard. Les requetes
# restent visibles en developpement.
x-jpa-logs-env: &jpa-logs-env
  SPRING_PROFILES_ACTIVE: json-logs
  SPRING_MAIN_BANNER_MODE: "off"
  SPRING_JPA_SHOW_SQL: "false"

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
  interval: 5s
  timeout: 5s
  retries: 10

services:

  # ---------- Bases de donnees (1 par service, pattern database-per-service) ----------
  postgres-event:
    image: postgres:16-alpine
    container_name: eventhub-postgres-event
    environment:
      POSTGRES_DB: event_db
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pwd
    ports:
      - "5433:5432"
    volumes:
      - pg_event_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  postgres-booking:
    image: postgres:16-alpine
    container_name: eventhub-postgres-booking
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: booking_user
      POSTGRES_PASSWORD: booking_pwd
    ports:
      - "5434:5432"
    volumes:
      - pg_booking_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  postgres-payment:
    image: postgres:16-alpine
    container_name: eventhub-postgres-payment
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_pwd
    ports:
      - "5435:5432"
    volumes:
      - pg_payment_data:/var/lib/postgresql/data
    healthcheck: *postgres-healthcheck

  # ---------- Bus d'evenements ----------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: eventhub-rabbitmq
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # UI de management (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Cache / verrou distribue ----------
  redis:
    image: redis:7-alpine
    container_name: eventhub-redis
    ports:
      - "6379:6379"

  # ---------- Identity provider ----------
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: eventhub-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json

  # ---------- Capture des emails en dev ----------
  mailhog:
    image: mailhog/mailhog:latest
    container_name: eventhub-mailhog
    ports:
      - "1025:1025" # serveur SMTP
      - "8025:8025" # UI web

  # ---------- Services applicatifs ----------
  # Les variables d'environnement remplacent les adresses "localhost" des application.yml
  # par les noms de service du reseau Docker.
  gateway:
    build: ./services/gateway
    ports:
      - "8080:8080"
    environment:
      <<: [*jwt-env, *logs-env]
      EVENTHUB_SERVICES_EVENT_SERVICE_URL: http://event-service:8082
      EVENTHUB_SERVICES_BOOKING_SERVICE_URL: http://booking-service:8083
      EVENTHUB_SERVICES_PAYMENT_SERVICE_URL: http://payment-service:8084
    depends_on:
      - keycloak
      - event-service
      - booking-service
      - payment-service

  event-service:
    build: ./services/event-service
    ports:
      - "8082:8082"
    environment:
      <<: [*jwt-env, *jpa-logs-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-event:5432/event_db
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres-event:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  booking-service:
    build: ./services/booking-service
    ports:
      - "8083:8083"
    environment:
      <<: [*jwt-env, *jpa-logs-env]
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-booking:5432/booking_db
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      EVENTHUB_EVENTSERVICE_BASEURL: http://event-service:8082
    depends_on:
      postgres-booking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started

  payment-service:
    build: ./services/payment-service
    ports:
      - "8084:8084"
    environment:
      <<: *jpa-logs-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-payment:5432/payment_db
      SPRING_RABBITMQ_HOST: rabbitmq
    depends_on:
      postgres-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./services/notification-service
    environment:
      <<: *logs-env
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_DATA_REDIS_HOST: redis
      SPRING_MAIL_HOST: mailhog
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
      mailhog:
        condition: service_started

  # ---------- Frontend ----------
  # Publie sur 5173, comme "npm run dev" : c'est l'origine autorisee par Keycloak
  # (redirectUris) et par le CORS du Gateway.
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - gateway

  adminer:
    image: adminer
    restart: always
    ports:
      - "8090:8080"
volumes:
  pg_event_data:
  pg_booking_data:
  pg_payment_data:
