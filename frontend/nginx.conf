server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Application monopage : toute route inconnue de nginx (ex. /bookings/42, ou le retour
    # de Keycloak apres connexion) doit servir index.html, c'est React Router qui tranche.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
