server:
  port: 8085

spring:
  application:
    name: notification-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        # Un envoi en echec (SMTP ou Redis indisponible) est retente avec un delai
        # croissant, puis le message est remis en queue (cf. RabbitMQConfig) : aucune
        # notification n'est perdue, et on evite une relivraison en boucle sans pause.
        # La duree totale des essais (35 s) depasse volontairement le bail de
        # deduplication (30 s), voir ProcessedEventStore.
        retry:
          enabled: true
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s
          max-attempts: 7

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 1025 # Mailhog en dev, remplacer par un vrai SMTP en prod
    default-encoding: UTF-8
    properties:
      # Sans ces delais, un serveur SMTP qui ne repond pas bloquerait le listener
      # indefiniment. Ils doivent rester inferieurs au bail de deduplication.
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

# Contrat de messagerie partage avec booking-service
eventhub:
  rabbitmq:
    exchange: booking.events
    routing-key:
      confirmed: booking.confirmed
      cancelled: booking.cancelled
  notification:
    from: no-reply@eventhub.local
    deduplication:
      # Duree pendant laquelle un evenement en cours de traitement est reserve
      lease: 30s
      # Duree pendant laquelle on se souvient d'un evenement deja notifie
      retention: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    mail:
      # Le service reste UP si le SMTP est momentanement injoignable : les envois
      # sont retentes, ce n'est pas une raison de le sortir du trafic.
      enabled: false
