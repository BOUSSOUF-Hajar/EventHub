server:
  port: 8080

spring:
  application:
    name: gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/eventhub

  cloud:
    gateway:
      routes:
        - id: event-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/events/**

        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**

        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
