server:
  port: 8083

spring:
  application:
    name: booking-service

  datasource:
    url: jdbc:postgresql://localhost:5434/booking_db
    username: booking_user
    password: booking_pwd

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false   # evite de garder une session ouverte pendant le rendu de la reponse

  data:
    redis:
      host: localhost
      port: 6379

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    # Indispensable au relais d'outbox : sans confirmation du broker, on marquerait
    # comme publies des evenements qui ne sont jamais arrives. Le mode "correlated"
    # rattache la confirmation a un message precis, ce qui permet de traiter un lot
    # sans confondre le sort de deux evenements.
    publisher-confirm-type: correlated
    # Complement du precedent : un ACK ne prouve que la reception par l'exchange.
    # Les retours signalent les messages qu'aucune queue n'a acceptes.
    publisher-returns: true
    template:
      # Sans "mandatory", un message sans queue destinataire est jete en silence.
      mandatory: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/eventhub

# Contrat de messagerie partage avec payment-service et notification-service
eventhub:
  event-service:
    base-url: http://localhost:8082
  rabbitmq:
    exchange: booking.events
    routing-key:
      requested: booking.requested
      confirmed: booking.confirmed
      cancelled: booking.cancelled
    # Exchange de payment-service, dont booking-service consomme les resultats
    payment:
      exchange: payment.events
      routing-key:
        succeeded: payment.succeeded
        failed: payment.failed
  booking:
    # BKG-3 : delai au-dela duquel une reservation impayee est annulee et ses places rendues
    payment-timeout: 15m
    expiration-poll-interval-ms: 60000
  outbox:
    poll-interval-ms: 1000
    batch-size: 100
    confirm-timeout-ms: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info
